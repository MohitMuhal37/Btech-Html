<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    margin: 0;
    padding: 20px;
    text-align: center;
}

h1 {
    color: #333;
    margin-bottom: 30px;
}

/* Responsive Grid Layout */
.gallery-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto;
}

/* Image Card Styling */
.gallery-item {
    overflow: hidden;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    background: #fff;
    cursor: pointer;
}

.gallery-item img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
}

/* Hover Zoom Effect */
.gallery-item img:hover {
    transform: scale(1.08);
}

/* Lightbox Styling */
.lightbox {
    display: none; /* Hidden by default */
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.8);
    justify-content: center;
    align-items: center;
}

.lightbox img {
    max-width: 80%;
    max-height: 80%;
    border-radius: 8px;
    box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
}

#closeBtn {
    position: absolute;
    top: 20px;
    right: 35px;
    color: #fff;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
}
    </style>
    <h1>My Photo Gallery</h1>

    <!-- Gallery Grid -->
    <div class="gallery-container">
        <div class="gallery-item">
            <img src="https://picsum.photos/id/1015/600/400" alt="Nature River">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/id/1025/600/400" alt="Cute Dog">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/id/1041/600/400" alt="Mountain View">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/id/1069/600/400" alt="Forest Pathway">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/id/1074/600/400" alt="Lion">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos/id/1084/600/400" alt="Walrus">
        </div>
    </div>

    <!-- Lightbox Modal (Hidden by default) -->
    <div id="lightbox" class="lightbox">
        <span id="closeBtn">&times;</span>
        <img id="lightboxImg" src="" alt="Zoomed Image">
    </div>
<script>
   // Select elements
const images = document.querySelectorAll('.gallery-item img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const closeBtn = document.getElementById('closeBtn');

// Open lightbox when an image is clicked
images.forEach(img => {
    img.addEventListener('click', () => {
        lightbox.style.display = 'flex';
        lightboxImg.src = img.src; // Set lightbox image source to clicked image
    });
});

// Close lightbox when the 'X' button is clicked
closeBtn.addEventListener('click', () => {
    lightbox.style.display = 'none';
});

// Close lightbox when clicking anywhere outside the image background
lightbox.addEventListener('click', (e) => {
    if (e.target !== lightboxImg) {
        lightbox.style.display = 'none';
    }
});
</script>
</body>
</html>
