<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube Layout</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="youtube.css">
</head>
<body>

    <div class="container">
        <div class="class1">
            <i class="fa-solid fa-bars" id="bars"></i>
            <i class="fa-brands fa-youtube"><span>Youtube</span></i>
            <input type="search" id="inp">
            <i class="fa-solid fa-magnifying-glass" href="www.google.com" /i>
            <i class="fa-solid fa-microphone"></i>
            <i class="fa-regular fa-bell"></i>
            <i class="fa-regular fa-user"></i>
        </div>

        <div class="contain">
            <div class="class3">
                <i class="fa-solid fa-house"></i>
            <i class="fa-solid fa-download"></i>
            <i class="fa-solid fa-circle-user"></i>
            </div>
        <div class="class2">
            <div class="box" id="one"></div>
            <div class="box" id="two"></div>
            <div class="box" id="three"></div>
            <div class="box" id="four"></div>
            <div class="box" id="five"></div>
            <div class="box" id="six"></div>
            <div class="box" id="seven"></div>
            <div class="box" id="eight"></div>
            <div class="box" id="nine"></div>
            <div class="box" id="ten"></div>
            <div class="box" id="eleven"></div>
            <div class="box" id="twelve"></div>
        </div>
        
        </div>
    </div>
</body>
</html>
